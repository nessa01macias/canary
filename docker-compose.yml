# Canary deployment — two services behind Caddy.
#
#   web  Caddy: serves the React bundle and reverse-proxies /api -> api:8000.
#   api  FastAPI/uvicorn: reads the derived layer (canary.duckdb) read-only.
#
# TOPOLOGY: Canary shares a host with Pharos (a separate business). pharos-caddy
# owns host ports 80/443 and terminates TLS for canarylayer.com, then proxies to
# canary-web over the canary_edge network. So `web` publishes NO ports and runs
# with SITE_ADDRESS=:80. It keeps its own Caddy purely to preserve the asset
# rules that MapLibre depends on (see frontend/Caddyfile — .mjs content-type and
# the no-SPA-fallback on /assets/*, both of which fail silently if lost).
#
# ISOLATION: two networks. `api` is on canary_internal only and cannot reach any
# Pharos container. Only canary-web joins canary_edge. Both services carry
# memory/CPU and log-size caps so neither project can starve or disk-fill the other.
#
# The raw archive (data/raw, 3.2GB+) and the pipeline are NOT part of this stack.
# Only the derived artifact canary.duckdb is shipped to the server (see deploy/push-duckdb.sh).
#
#   cp .env.example .env   # fill in values, then:
#   docker compose up -d --build

services:
  api:
    build: ./backend
    # PINNED, and deliberately NOT :latest. This is the image that has served
    # production since 2026-07-30, transplanted here during the host migration.
    #
    # It predates commit bfbbc7c ("API Phase 1: gate the API"). Every commit
    # from bfbbc7c onward wraps the data routers in Depends(require_key), and
    # with SUPABASE_SERVICE_KEY unset that gate fails CLOSED — every /api/*
    # returns 401, all the map's fetches live inside map.on('load'), and you
    # get a blank map with NO console error. Rebuilding this service without
    # first resolving the gate is therefore a silent outage.
    #
    # Before you ever run `docker compose build api`, read DEPLOY.md's
    # "API gate" gotcha and either set CANARY_DEV_OPEN_API=1 or plumb real keys.
    image: canary-api:pregate-20260730
    # Explicit name so the shared edge proxy can address these by a stable,
    # project-scoped identity rather than the generic compose service name.
    container_name: canary-api
    restart: unless-stopped
    environment:
      # Serving reads the derived DB read-only…
      CANARY_DUCKDB: /data/canary.duckdb
      # …and is the ONLY place that touches Supabase (user contributions write).
      # Keys live here, server-side — never in the frontend bundle.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      # LLM keys for future server-side endpoints (e.g. /api/explain — plain-English
      # summaries of the data at request time). All optional (:- default empty), so
      # the container runs fine with none set; fill in whichever provider you use.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Commute routing (Stadia/Valhalla). Optional: absent → /api/commute
      # answers ok:false "routing_unconfigured" and the UI shows times as "—".
      STADIA_API_KEY: ${STADIA_API_KEY:-}
    volumes:
      # The pushed artifact, mounted read-only. Nothing in this container writes it.
      - ./backend/data/canary.duckdb:/data/canary.duckdb:ro
      # Small derived artifacts read straight off disk by the API (claims.json
      # for /api/claims + the news cards, freshness.json for /api/freshness).
      # The code resolves them relative to the backend dir → /app inside the image.
      - ./backend/data/processed:/app/data/processed:ro
      # Overture Places snapshot (~2MB) for /api/places/search — the small-business
      # lookup behind the commute "add a place" field. Absent → [] (MapTiler only).
      - ./backend/data/raw/overture_places:/app/data/raw/overture_places:ro
    expose:
      - "8000"
    # Internal network ONLY. The api shares a host with Pharos (a separate
    # business), and must not be able to reach pharos-backend-* or admin-backend.
    # Docker doesn't route between bridge networks, so this is enforced, not
    # merely conventional.
    networks:
      - canary_internal
    # Blast-radius ceilings, not a squeeze — the host has 62GB/14 cores. These
    # stop a runaway Canary process from starving the live Pharos containers.
    mem_limit: 2g
    cpus: 2.0
    # Pharos caps its logs the same way. Without this an unbounded log is a
    # shared-fate disk-fill that would take Pharos down along with Canary.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      # Context is the repo root (not ./frontend) so the Docs page can import
      # repo-root markdown (RESEARCH.md etc.) at build time. See frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Only the map-tile key is client-side. No DB creds reach the browser.
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY}
    # PINNED, and the tag must change on every rebuild — never reuse a tag, or you
    # overwrite the image you would roll back to. `canary-web:75df17b` is still on
    # the box as the pre-landing-page rollback target.
    #
    # This is a FRONTEND-ONLY deploy (see DEPLOY.md gotcha 6): the web image copies
    # nothing from backend/, so shipping it leaves `api` on its pinned pre-gate
    # image. That is what keeps the API ungated (gotcha 11) AND keeps /api/commute
    # answering routing_unconfigured — the commute mock that reports synthetic ETAs
    # as real is backend code, so it does not ship with this.
    # Verified before deploying: every /api/* path this bundle calls already exists
    # on the pinned api. Re-check that if the frontend starts calling a new endpoint.
    image: canary-web:landing-20260812
    # pharos-caddy routes canarylayer.com here by this exact name. Never rely on
    # the bare service name `web` on a shared network — a future Pharos service
    # called `web` would silently hijack the route.
    container_name: canary-web
    restart: unless-stopped
    environment:
      # MUST be ":80" on the shared Pharos host: pharos-caddy terminates TLS and
      # reverse-proxies to this container over plain HTTP. Set to a hostname here
      # and this inner Caddy would race for its own Let's Encrypt cert behind a
      # proxy that already has one — cert failures and redirect loops.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # NO ports: block. pharos-caddy owns host 80/443 on this box; this container
    # is reached only through it, over canary_edge.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # canary_internal to reach `api`; canary_edge so pharos-caddy can reach us.
      # This container is the single deliberate seam between the two projects.
      - canary_internal
      - canary_edge
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - api

networks:
  # Private to this project — Pharos containers are not on it.
  canary_internal:
    driver: bridge
  # Created out-of-band (`docker network create canary_edge`) and shared with
  # exactly one foreign container: pharos-caddy. Declared external so this
  # compose project never owns or deletes it.
  canary_edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
